name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for participating in this project!
        Please fill out the following sections to help us understand the issue you're experiencing.

        **Before submitting:**
          - Make sure you are using the latest version of the extension
          - Search existing issues - your question might already be answered
          - Include as many details as possible (screenshots, console errors, logs, etc.)
  
  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: What is happening?
    validations:
      required: true
  
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce the issue
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Run command '...'
        4. See error
    validations:
      required: true
  
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      placeholder: |
        - Magento Version: 2.4.x
        - PHP Version: 8.x
        - JustBetter Core Version: x.x.x
    validations:
      required: true
  
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or error logs
      placeholder: Paste any relevant logs, error messages, or screenshots here
    validations:
      required: false
  
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched for existing issues
          required: true
        - label: I am using the latest version
          required: false
        - label: I have checked the documentation
          required: false
