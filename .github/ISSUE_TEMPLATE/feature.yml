name: Feature Request
description: Request a new feature or enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for participating in this project!
        Please fill out the following sections to help us understand what you want.

        **Before submitting:**
          - Make sure you are using the latest version of the extension
          - Search existing issues and PRs - there might be a similar request already
          - Include as many details as possible about your use case
  
  - type: textarea
    id: requested-feature
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
      placeholder: A clear and concise description of what you want to happen
    validations:
      required: true
  
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why would you need this feature? How are you currently limited?
      placeholder: Describe your use case and why this feature would be valuable
    validations:
      required: true
  
  - type: dropdown
    id: feature-category
    attributes:
      label: Feature Category
      description: Which area does this feature relate to?
      options:
        - Admin Menu
        - System Configuration
        - Module Information
        - Notifications
        - CLI Commands
        - API
        - Other
    validations:
      required: true
  
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How do you envision this feature working?
      placeholder: |
        Describe your proposed solution in detail:
        - How should it work?
        - What configuration options should be available?
        - How should it integrate with existing functionality?
    validations:
      required: false
  
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or features?
      placeholder: Describe any alternative solutions you've considered
    validations:
      required: false
  
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to contribute to this feature?
      options:
        - label: I am willing to submit a PR for this feature
          required: false
        - label: I can help with testing
          required: false
